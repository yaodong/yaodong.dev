<article class="py-3 px-2 transition-all duration-200 space-y-1">
  <header>
    <a class="block" href="{{ post.url }}">
      <h3 class="font-semibold text-stone-900 hover:text-stone-600 transition-colors duration-200">
        {{ post.title }}
      </h3>
    </a>
  </header>

  <time class="block text-stone-500 text-sm">
    {{ post.created_date | date: site.date_format | default: "%b %-d, %Y" }}
  </time>

  {% if post.tags.size > 0 and include.show_tags != false %}
  <div class="flex flex-wrap gap-1 mt-1">
    {% for tag in post.tags limit:3 %}
    <a href="{{ '/tags/' | append: tag | append: '/' | relative_url }}" class="text-xs text-stone-500 hover:text-stone-700 transition-colors">
      #{{ tag }}
    </a>
    {% endfor %}
    {% if post.tags.size > 3 %}
    <span class="text-xs text-stone-400">+{{ post.tags.size | minus: 3 }}</span>
    {% endif %}
  </div>
  {% endif %}
</article>
