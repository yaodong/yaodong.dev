---
layout: archive
prefix: Posts in category
---

<!-- Category Navigation -->
<div class="category-navigation mb-4">
  {% assign all_categories = site.categories | map: "name" | sort %}
  {% assign current_category = page.title %}

  <div class="flex flex-wrap gap-2 py-2">
    {% for category in all_categories %}
      <a href="/categories/{{ category }}/"
         class="px-3 py-1 rounded-md text-sm {% if category == current_category %}bg-amber-200 dark:bg-amber-800 text-stone-900 dark:text-stone-100 font-medium{% else %}bg-stone-200 dark:bg-stone-700 text-stone-700 dark:text-stone-300 hover:bg-stone-300 dark:hover:bg-stone-600{% endif %} transition-colors">
        {{ category | capitalize }}
      </a>
    {% endfor %}
  </div>
</div>
