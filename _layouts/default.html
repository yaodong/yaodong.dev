<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}" class="scroll-smooth">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="{% if page.title %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:image" content="{{ site.url }}/assets/images/og-image.jpg">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta name="twitter:image" content="{{ site.url }}/assets/images/og-image.jpg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/stylesheets/application.css?t={{ site.time | date: '%s' }}">
  {% seo %}
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen antialiased">
  <header class="mx-auto flex w-full max-w-3xl items-center justify-between px-5 pt-8 font-sans">
    <div class="flex items-center space-x-3">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           class="text-stone-700">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M6 15h15" />
        <path d="M21 19h-15" />
        <path d="M15 11h6" />
        <path d="M21 7h-6" />
        <path d="M9 9h1a1 1 0 1 1 -1 1v-2.5a2 2 0 0 1 2 -2" />
        <path d="M3 9h1a1 1 0 1 1 -1 1v-2.5a2 2 0 0 1 2 -2" />
      </svg>
      <a href="{{ '/' | relative_url }}" class="text-stone-800 font-bold hover:text-stone-600 transition-colors">
        {{ site.title }}
      </a>
    </div>
    <nav class="flex items-center space-x-4">
      {% for item in site.navigation %}
      <a href="{{ item.url | relative_url }}" class="text-stone-600 hover:text-stone-900 transition-colors">
        {{ item.title }}
      </a>
      {% endfor %}
    </nav>
  </header>

  <div class="mx-auto w-full max-w-3xl px-5 py-8">
    {{ content }}
  </div>

  <footer class="mx-auto w-full max-w-3xl px-5 pb-12 text-center text-sm text-stone-600">
    &copy; {{ site.time | date: '%Y' }} Yaodong Zhao. All rights reserved.
  </footer>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E8XC309H1N"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-E8XC309H1N');
  </script>
</body>
</html>
