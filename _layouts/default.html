<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}" class="scroll-smooth">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/stylesheets/application.css?t={{ site.time | date: '%s' }}">
  {% seo %}
</head>
<body class="min-h-screen antialiased">
  <header class="mx-auto flex w-full max-w-4xl items-center justify-between px-6 py-10">
    <a href="{{ '/' | relative_url }}" class="logo-text text-lg hover:text-[var(--color-accent)]">
      {{ site.title }}
    </a>
    <nav class="flex items-center gap-6">
      {% for item in site.navigation %}
      <a href="{{ item.url | relative_url }}" class="nav-link{% if page.url == item.url %} nav-link-active{% endif %}">
        {{ item.title }}
      </a>
      {% endfor %}
    </nav>
  </header>

  <main class="mx-auto w-full max-w-4xl px-6 pb-16">
    {{ content }}
  </main>

  <footer class="site-footer mx-auto w-full max-w-4xl px-6 pb-12 text-center">
    <div class="divider mb-8"></div>
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}</p>
  </footer>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E8XC309H1N"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-E8XC309H1N');
  </script>
</body>
</html>
