<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <script>
    // Prevent FOUC by applying theme immediately
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme) {
        document.documentElement.classList.add(theme);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/stylesheets/application.css?t={{ site.time | date: '%s' }}">
  {% seo %}
</head>
<body class="min-h-screen antialiased">
  <header class="mx-auto flex w-full max-w-4xl items-center justify-between px-4 py-6 sm:px-6 sm:py-10">
    <a href="{{ '/' | relative_url }}" class="logo-text text-lg hover:text-[var(--color-accent)]">
      {{ site.title }}
    </a>
    <nav class="flex items-center gap-4 sm:gap-6">
      {% for item in site.navigation %}
      <a href="{{ item.url | relative_url }}" class="nav-link{% if page.url == item.url %} nav-link-active{% endif %}">
        {{ item.title }}
      </a>
      {% endfor %}
      <button type="button" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </nav>
  </header>

  <main class="mx-auto w-full max-w-4xl px-0 pb-12 sm:px-6 sm:pb-16">
    {{ content }}
  </main>

  <footer class="site-footer mx-auto w-full max-w-4xl px-4 pb-10 text-center sm:px-6 sm:pb-12">
    <div class="divider mb-8"></div>
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}</p>
  </footer>

  <script>
    // Theme toggle functionality
    (function() {
      const root = document.documentElement;
      const toggle = document.querySelector('.theme-toggle');
      const STORAGE_KEY = 'theme';

      // Get stored theme or null for system default
      function getStoredTheme() {
        return localStorage.getItem(STORAGE_KEY);
      }

      // Apply theme to document
      function applyTheme(theme) {
        root.classList.remove('light', 'dark');
        if (theme) {
          root.classList.add(theme);
        }
      }

      // Get current effective theme
      function getCurrentTheme() {
        const stored = getStoredTheme();
        if (stored) return stored;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      // Toggle theme
      function toggleTheme() {
        const current = getCurrentTheme();
        const next = current === 'dark' ? 'light' : 'dark';
        localStorage.setItem(STORAGE_KEY, next);
        applyTheme(next);
      }

      // Initialize
      applyTheme(getStoredTheme());

      // Bind click handler
      if (toggle) {
        toggle.addEventListener('click', toggleTheme);
      }

      // Listen for system theme changes
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        if (!getStoredTheme()) {
          // Only react if user hasn't manually set a preference
          applyTheme(null);
        }
      });
    })();
  </script>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E8XC309H1N"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-E8XC309H1N');
  </script>
</body>
</html>
