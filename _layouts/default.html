<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}" class="scroll-smooth">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
  {% include head.html %}
  <script>
    // On page load, check for user preference or localStorage
    document.addEventListener('DOMContentLoaded', function() {
      // Check localStorage for a saved manual preference
      const storedTheme = localStorage.getItem('theme');
      const userManuallySet = localStorage.getItem('userManuallySet') === 'true';
      const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
      const prefersDark = mediaQuery.matches;
      
      if (storedTheme && userManuallySet) {
        // User has manually set a preference, apply it and mark as overridden
        document.documentElement.classList.toggle('dark', storedTheme === 'dark');
        document.documentElement.classList.add('theme-override');
      } else {
        // No manual preference, follow system preference
        document.documentElement.classList.toggle('dark', prefersDark);
        // Store the current system preference
        localStorage.setItem('theme', prefersDark ? 'dark' : 'light');
        localStorage.setItem('userManuallySet', 'false');
      }
      
      // Update the toggle button state
      updateToggleIcon();
      
      // Listen for system theme changes
      mediaQuery.addEventListener('change', (e) => {
        // Only apply system preference changes if user hasn't manually overridden
        if (!document.documentElement.classList.contains('theme-override')) {
          const prefersDark = e.matches;
          document.documentElement.classList.toggle('dark', prefersDark);
          localStorage.setItem('theme', prefersDark ? 'dark' : 'light');
          updateToggleIcon();
        }
      });
    });
    
    function toggleTheme() {
      // Toggle dark class on html element
      document.documentElement.classList.toggle('dark');
      
      // Mark as manually overridden
      document.documentElement.classList.add('theme-override');
      
      // Store preference and manual override flag
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      localStorage.setItem('userManuallySet', 'true');
      
      // Update the icon
      updateToggleIcon();
    }
    
    // Function to reset to system preference
    function resetToSystemPreference() {
      // Remove manual override flag
      document.documentElement.classList.remove('theme-override');
      localStorage.setItem('userManuallySet', 'false');
      
      // Apply system preference
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', prefersDark);
      localStorage.setItem('theme', prefersDark ? 'dark' : 'light');
      
      // Update the icon
      updateToggleIcon();
    }
    
    // Initialize event listeners only once
    let resetButtonListenersInitialized = false;
    
    function updateToggleIcon() {
      const isDark = document.documentElement.classList.contains('dark');
      const isSystemMode = !document.documentElement.classList.contains('theme-override');
      const lightIcon = document.getElementById('light-icon');
      const darkIcon = document.getElementById('dark-icon');
      const systemIndicator = document.getElementById('system-indicator');
      const resetButton = document.getElementById('reset-button');
      
      // Update sun/moon icons
      if (isDark) {
        lightIcon.classList.remove('hidden');
        lightIcon.classList.add('rotate-0');
        darkIcon.classList.add('hidden');
        darkIcon.classList.remove('rotate-0');
      } else {
        lightIcon.classList.add('hidden');
        lightIcon.classList.remove('rotate-0');
        darkIcon.classList.remove('hidden');
        darkIcon.classList.add('rotate-0');
      }
      
      // Update system preference indicator
      if (isSystemMode) {
        systemIndicator.classList.remove('hidden');
        resetButton.classList.add('hidden');
      } else {
        systemIndicator.classList.add('hidden');
        
        // Add hover functionality for the reset button (once)
        if (!resetButtonListenersInitialized) {
          const themeToggle = resetButton.previousElementSibling;
          
          themeToggle.addEventListener('mouseenter', () => {
            resetButton.classList.remove('hidden');
          });
          
          themeToggle.addEventListener('mouseleave', (e) => {
            // Only hide if not hovering over the reset button
            if (!resetButton.contains(e.relatedTarget)) {
              resetButton.classList.add('hidden');
            }
          });
          
          resetButton.addEventListener('mouseenter', () => {
            resetButton.classList.remove('hidden');
          });
          
          resetButton.addEventListener('mouseleave', () => {
            resetButton.classList.add('hidden');
          });
          
          resetButtonListenersInitialized = true;
        }
      }
    }
  </script>
</head>
<body class="bg-stone-50 dark:bg-stone-900 text-stone-900 dark:text-stone-100 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <header class="flex justify-between items-center font-serif mb-8">
      <div class="flex items-center space-x-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="text-stone-700 dark:text-stone-300">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M6 15h15" />
          <path d="M21 19h-15" />
          <path d="M15 11h6" />
          <path d="M21 7h-6" />
          <path d="M9 9h1a1 1 0 1 1 -1 1v-2.5a2 2 0 0 1 2 -2" />
          <path d="M3 9h1a1 1 0 1 1 -1 1v-2.5a2 2 0 0 1 2 -2" />
        </svg>
        <a href="/" class="text-stone-800 dark:text-stone-200 font-bold hover:text-stone-600 dark:hover:text-stone-400 transition-colors">
          {{ site.title }}
        </a>
      </div>
      <nav class="flex items-center space-x-4">
        <a href="/" class="text-stone-600 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-200 transition-colors">
          Home
        </a>
        <a href="/stream" class="text-stone-600 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-200 transition-colors">
          Stream
        </a>
        <a href="/about" class="text-stone-600 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-200 transition-colors">
          About
        </a>
        <div class="relative">
          <button onclick="toggleTheme()" class="flex items-center justify-center h-8 w-8 rounded-full bg-stone-200 dark:bg-stone-700 text-stone-700 dark:text-stone-300 hover:bg-stone-300 dark:hover:bg-stone-600 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-stone-400 dark:focus:ring-stone-300 cursor-pointer" aria-label="Toggle Dark Mode" title="Toggle dark/light mode">
            <!-- Sun icon for dark mode (show when dark mode is active) -->
            <svg id="light-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden transform transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <!-- Moon icon for light mode (show when light mode is active) -->
            <svg id="dark-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
            <!-- System indicator dot (visible when in system preference mode) -->
            <span id="system-indicator" class="absolute top-0 right-0 h-2 w-2 rounded-full bg-green-400 hidden" title="Following system preference"></span>
          </button>
          <!-- Reset to system preference option (visible on hover when manually set) -->
          <button id="reset-button" onclick="resetToSystemPreference()" class="absolute top-full right-0 mt-1 text-xs px-2 py-1 bg-stone-100 dark:bg-stone-700 text-stone-700 dark:text-stone-300 rounded shadow-sm hover:bg-stone-200 dark:hover:bg-stone-600 transition-all duration-200 focus:outline-none hidden" aria-label="Reset to system preference" title="Reset to system preference">
            System
          </button>
        </div>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="my-12 text-stone-600 dark:text-stone-400 text-sm">
      <div class="text-center">&copy; {{ site.time | date: '%Y' }} Yaodong Zhao. All rights reserved.</div>
    </footer>
  </div>
</body>
</html>
