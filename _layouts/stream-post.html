---
layout: default
---

<article class="bg-white dark:bg-stone-800 sm:rounded-lg shadow-sm mx-auto max-w-4xl">
  <div class="p-4 sm:p-6 lg:p-8">
    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-8">
      <a href="/stream" class="group inline-flex items-center space-x-2 text-sm text-stone-500 hover:text-stone-700 dark:text-stone-400 dark:hover:text-stone-300">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="transition-transform group-hover:-translate-x-1">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M12 21a9 9 0 1 0 0 -18a9 9 0 0 0 0 18" />
          <path d="M8 12l4 4" />
          <path d="M8 12h8" />
          <path d="M12 8l-4 4" />
        </svg>
        <span>Back to Stream</span>
      </a>
      
      <div class="flex flex-row items-center gap-4">
        <time datetime="{{ page.date | date: '%Y-%m-%d' }}" class="text-sm text-stone-500 dark:text-stone-400">
          {{ page.date | date: "%B %d, %Y %H:%M" }}
        </time>
        {% include permalink-button.html url=page.url %}
      </div>
    </div>

    <div class="max-w-3xl mx-auto">
      <div class="prose dark:prose-invert prose-stone prose-lg max-w-none">
        {{content}}
      </div>
    </div>
  </div>
</article>
