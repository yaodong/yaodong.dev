# Site settings
title: "yaodong.dev"
description: "Personal blog of Yaodong Zhao"
url: "https://yaodong.dev"
baseurl: ""
author: "Yaodong Zhao"

# Permalink structure with year to avoid conflicts
permalink: /:title/

# Date format for consistent display
date_format: "%b %-d, %Y"

# Navigation configuration
navigation:
  - title: Home
    url: /
  - title: Archive
    url: /archive/
  - title: About
    url: /about/

# Plugin settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - bin
  - node_modules
  - bun.lockb
  - Procfile.dev
  - package.json
  - postcss.config.js
  - tailwind.config.js
  - tsconfig.json
  - README.md
  - AGENTS.md
  - .idea
  - .github
  - .devcontainer
  - .bun-version
  - .claude
