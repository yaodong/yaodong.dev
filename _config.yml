# the base hostname & protocol for your site, e.g. http://example.com
url: ""

# the subpath of your site, e.g. /blog
baseurl: ""

# use /posts/post-name/ as permalink
permalink: /:title/

# the name of your site, e.g. ACME Corp.
title: "yaodong.dev"

# Collections
collections:
  stream:
    output: true
    permalink: /stream/:title/

# Default settings for specific paths
defaults:
  -
    scope:
      path: ""
      type: "stream"
    values:
      layout: "stream-post"
      category: "stream"

plugins:
  - jekyll-feed

exclude:
  - bin
  - node_modules
  - bun.lockb
  - Procfile.dev
  - package.json
  - postcss.config.js
  - tailwind.config.js
  - tsconfig.json
  - README.md
  - .idea
  - .github
  - .devcontainer
  - .bun-version
