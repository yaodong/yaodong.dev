# Site settings
title: "yaodong.dev"
description: "Personal blog of Yaodong Zhao"
url: "https://yaodong.dev"
baseurl: ""
author: "Yaodong Zhao"
default_image: "/assets/images/og-image.png"

# Social links for jekyll-seo-tag
twitter:
  username: YaodongDev

# Permalink structure with year to avoid conflicts
permalink: /:title/

# Date format for consistent display
date_format: "%b %-d, %Y"

# Navigation configuration
navigation:
  - title: Home
    url: /
  - title: Archive
    url: /archive/
  - title: Projects
    url: /projects/
  - title: Library
    url: /library/
  - title: About
    url: /about/

# Plugin settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - bin
  - scripts
  - node_modules
  - bun.lock
  - bun.lockb
  - Procfile.dev
  - package.json
  - postcss.config.js
  - tailwind.config.js
  - tsconfig.json
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - .idea
  - .github
  - .devcontainer
  - .bun-version
  - .claude
