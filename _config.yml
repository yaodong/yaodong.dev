# Site settings
title: "yaodong.dev"
description: "Personal blog of Yaodong Zhao"
url: "https://yaodong.dev"
baseurl: ""

# Permalink structure with year to avoid conflicts
permalink: /:title/

# Date format for consistent display
date_format: "%b %-d, %Y"

# Navigation configuration
navigation:
  - title: Home
    url: /
  - title: Archive
    url: /archives/2025/
  - title: Library
    url: /library/
  - title: About
    url: /about/

# Plugin settings
plugins:
  - jekyll-feed
  - jekyll-archives
  - jekyll-seo-tag

jekyll-archives:
  enabled:
    - year
    - tags
    - categories
  layouts:
    year: archive-year
    tag: archive-tag
    category: archive-category
  permalinks:
    year: '/archives/:year/'
    tag: '/tags/:name/'
    category: '/categories/:name/'

exclude:
  - bin
  - node_modules
  - bun.lockb
  - Procfile.dev
  - package.json
  - postcss.config.js
  - tailwind.config.js
  - tsconfig.json
  - README.md
  - .idea
  - .github
  - .devcontainer
  - .bun-version
